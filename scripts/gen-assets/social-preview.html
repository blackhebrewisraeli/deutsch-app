<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Open Graph / Twitter share card — 1200x630 (1.91:1, the OG aspect).
      Rendered to public/social-preview.png by `npm run gen:assets`.

      THIS FILE FETCHES NOTHING FROM THE NETWORK. The generator serves the repo
      root over localhost so the <link> below resolves to the app's OWN vendored
      face.css — the same three families, the same absolute /fonts/ URLs. The
      version this replaced pulled Google Fonts in over the network, which made
      the card depend on a CDN the app deliberately stopped using in #103.
      brandAssets.test.js asserts this file contains no remote URL and no CSS
      at-rule that could reintroduce one.

      There is also no emoji and no dingbat anywhere in here. The old card set
      its feature pills with emoji and its correct-answer tick with U+2713, none
      of which any vendored family covers — so all five glyphs came from
      whatever the rasterising OS supplied, and the render changed by machine.
      The tick is an inline <svg> path now.

      Colours are today's LIGHT palette from src/lib/themeTokens.js. The card
      this replaced still grounded on parchment #FDF3C0, retired when light mode
      moved to ivory, and set its prose in Fraunces italic, retired when body
      copy moved to Plus Jakarta Sans on 2026-09-01.
    -->
    <link rel="stylesheet" href="/fonts/fraunces/face.css" />
    <link rel="stylesheet" href="/fonts/plus-jakarta-sans/face.css" />
    <link rel="stylesheet" href="/fonts/jetbrains-mono/face.css" />
    <style>
      :root {
        --ground: #fbf8f1;
        --surface: #ffffff;
        --fg: #16110b;
        --fg-muted: #5c5142;
        --border: #e2ddd2;
        --lip: #e5dfd0;
        --success: #2f7d3a;
        --success-deep: #246330;
        --error: #c41e1e;
        --flag-black: #0d0d0f;
        --flag-red: #dd0000;
        --flag-gold: #ffce00;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: flex;
        position: relative;
        background: var(--ground);
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(22, 17, 11, 0.05) 1px,
          transparent 0
        );
        background-size: 26px 26px;
        color: var(--fg);
        /* Prose face. AGENTS.md → Typography: Plus Jakarta Sans for body. */
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      /* Display face. The serif is the brand at headword scale — and only there. */
      .display {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 900;
      }
      /* UI labels, uppercase, and IPA. */
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }

      .left {
        flex: 1;
        padding: 64px 0 64px 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .eyebrow {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3em;
        color: var(--fg-muted);
        margin-bottom: 20px;
      }
      .wordmark {
        font-size: 118px;
        letter-spacing: -0.05em;
        line-height: 0.92;
      }
      .wordmark span {
        color: var(--error);
      }
      .tagline {
        font-size: 25px;
        font-weight: 500;
        line-height: 1.38;
        color: var(--fg-muted);
        margin-top: 20px;
        max-width: 580px;
      }
      .pills {
        display: flex;
        gap: 11px;
        margin-top: 34px;
        flex-wrap: wrap;
      }
      .pill {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 9px 17px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1em;
        box-shadow: 0 3px 0 var(--lip);
      }

      .right {
        width: 442px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 16px;
        padding-right: 66px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 34px 24px 30px;
        text-align: center;
        box-shadow: 0 8px 0 var(--lip);
      }
      .headword {
        font-size: 58px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .ipa {
        font-size: 15px;
        color: var(--fg-muted);
        margin-top: 12px;
      }
      .tiles {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 12px;
      }
      .tile {
        border-radius: 15px;
        padding: 15px 10px;
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        background: var(--surface);
        border: 1px solid var(--border);
        box-shadow: 0 4px 0 var(--lip);
      }
      .tile.correct {
        background: var(--success);
        border-color: var(--success);
        color: #ffffff;
        box-shadow: 0 4px 0 var(--success-deep);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
      }

      .flag {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 14px;
        display: flex;
        flex-direction: column;
      }
      .flag > div {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="mono eyebrow">SPRACHSCHULE · EST. 2026</div>
      <div class="display wordmark">Deutsch<span>.</span></div>
      <p class="tagline">
        An AI tutor for German — guided chat, spaced-repetition vocabulary and translation drills.
      </p>
      <div class="pills">
        <span class="mono pill">AI TUTOR</span>
        <span class="mono pill">SRS VOCAB</span>
        <span class="mono pill">PROGRESS</span>
        <span class="mono pill">INSTALLABLE</span>
      </div>
    </div>

    <div class="right">
      <div class="card">
        <div class="display headword">Hallo</div>
        <div class="mono ipa">[ˈhalo]</div>
      </div>
      <div class="tiles">
        <div class="mono tile">GOOD EVENING</div>
        <div class="mono tile correct">
          HELLO
          <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M2 8.6 L6.2 12.8 L14 4.2"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="mono tile">PLEASE</div>
        <div class="mono tile">GOOD MORNING</div>
      </div>
    </div>

    <div class="flag">
      <div style="background: var(--flag-black)"></div>
      <div style="background: var(--flag-red)"></div>
      <div style="background: var(--flag-gold)"></div>
    </div>
  </body>
</html>
