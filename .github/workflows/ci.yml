name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    env:
      HUSKY: 0 # don't install git hooks in CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # .npmrc sets legacy-peer-deps=true (eslint-plugin-react peer-dep workaround)
      #
      # --ignore-scripts: a dependency's install/postinstall hook is arbitrary
      # code from the registry running with the job's token in its environment.
      # Only two packages in the tree declare one — esbuild and @sentry/cli —
      # and neither needs it here: esbuild 0.21 ships its binary as a platform
      # optionalDependency (@esbuild/<platform>), which npm installs without
      # running anything, and @sentry/cli's binary is only used for source-map
      # upload, which this build does not do. Verified by a clean
      # `npm ci --ignore-scripts` followed by a full build and the whole suite.
      # Our own `prepare: husky` is already a no-op in CI via HUSKY: 0 above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Its own job, not extra steps in `verify`: lint/test/build feedback must not
  # wait on a browser download, and a contrast regression should read as its own
  # red X rather than hiding inside a generic test failure.
  #
  # No Supabase env on purpose. The audit seeds localStorage itself and never
  # signs in, so auth-unconfigured is a legitimate surface to walk — and adding
  # secrets here would make the job fail on forks.
  contrast-audit:
    name: Contrast · Rendered DOM
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      AUDIT_BASE: http://localhost:5290

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts for the reason spelled out in the verify job above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # playwright itself is already a devDependency — only the browser binary
      # and its system libs are missing on the runner.
      #
      # `npx --no` runs ONLY the locally installed binary. Bare `npx <name>`
      # silently fetches and executes whatever the registry answers with if the
      # name is missing or misspelled, at whatever version it resolves — the
      # version is pinned by package-lock.json only when the package is already
      # local. --no turns that into a hard failure instead.
      - name: Install Chromium
        run: npx --no -- playwright install --with-deps chromium

      # Stub Supabase config, not real credentials. `isAuthConfigured()` only
      # checks that both values are truthy, so a fake host is enough to make the
      # build render the account chrome — the AccountChip, the Stats account
      # section, the league table and the profile card — which the audit then
      # reaches with a seeded session and stubbed responses. Without this the
      # signed-in half of the audit has nothing to look at, which is how those
      # surfaces went unaudited for as long as they did. Nothing here is secret
      # and nothing reaches the network: the audit intercepts every call.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://stub.supabase.co
          VITE_SUPABASE_ANON_KEY: stub-anon-key-not-a-secret
          VITE_LEAGUES_ENABLED: 'true'

      # Serve, wait, and audit in one step so the backgrounded server is
      # guaranteed to outlive the shell that started it. The production build is
      # what users get, so it is what gets audited — not the dev server.
      - name: Audit contrast against the production build
        run: |
          npx --no -- vite preview --port 5290 --strictPort &
          # Poll rather than sleep — a fixed sleep is how this job becomes flaky.
          for i in $(seq 1 60); do
            if curl -sf "$AUDIT_BASE" > /dev/null; then
              echo "preview server up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "preview server never answered on $AUDIT_BASE"
              exit 1
            fi
            sleep 1
          done
          npm run audit:contrast
        env:
          # Must match the build above: the script derives the supabase-js
          # session storage key (`sb-<ref>-auth-token`) from this host.
          VITE_SUPABASE_URL: https://stub.supabase.co

  rls-policy-tests:
    name: RLS Policy Tests
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts for the reason spelled out in the verify job above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Pinned, not `latest`. Resolving `latest` makes setup-cli call the
      # unauthenticated GitHub releases API on every run, which fails the whole
      # job with "Failed to resolve latest Supabase CLI release: rate limit
      # exceeded" — it did exactly that on PR #117, 21s in, with the RLS suite
      # never executing. A pinned version skips the lookup entirely, and a red
      # RLS job then means a real policy regression rather than GitHub's quota.
      # Bump deliberately when a migration needs a newer CLI.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Start local Supabase (applies migrations)
        run: supabase start

      - name: Run RLS adversarial suite
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${SUPABASE_URL:-$API_URL}"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SERVICE_ROLE_KEY}"
          npm run test:rls
