# Generates github-metrics.svg for the profile README via lowlighter/metrics.
# Requires repository secret METRICS_TOKEN = fine-grained PAT with:
#   Contents: Read and write (this repo)
#   Metadata: Read-only
# Optional (richer stats): Public Repositories (read) / Administration not required.
name: GitHub Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: blackhebrewisraeli
          filename: github-metrics.svg
          output_action: commit
          committer_message: "chore: update github-metrics.svg"
          base: header
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_repositories: yes
          plugin_repositories_featured: |
            blackhebrewisraeli/github-skills-journey
            blackhebrewisraeli/C-Assembler-Simulator
            blackhebrewisraeli/Transportation-system-project
            blackhebrewisraeli/ebpf-bcc-tracing-lab
            blackhebrewisraeli/Python-SQL-Bank-Account-Database
            blackhebrewisraeli/Java-sorting-searching-templates
          config_timezone: Asia/Jerusalem
          config_order: base.header, isocalendar, languages, repositories, habits
